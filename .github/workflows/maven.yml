name: Deploy to EC2

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ JDK 21 설치 (필요하면 버전 수정)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ 프로젝트 빌드 (Gradle or Maven)
      - name: Build project
        run: |
          chmod +x gradlew  # Gradle Wrapper 권한 부여
          ./gradlew build -x test  # 테스트 제외하고 빌드

      # 4️⃣ EC2 인스턴스로 JAR 파일 전송 (scp 사용)
      - name: Transfer JAR to EC2
        run: |
          echo "$SSH_PRIVATE_KEY" > github-actions-key
          chmod 600 github-actions-key
          scp -i github-actions-key -o StrictHostKeyChecking=no \
            build/libs/*.jar $EC2_USER@$EC2_HOST:/home/$EC2_USER/geuckrock/tobe/

      # 5️⃣ EC2에서 기존 애플리케이션 종료 후 새 JAR 실행
      - name: Restart Application on EC2
        run: |
          ssh -i github-actions-key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
          echo "Stopping existing application..."
          pkill -f /home/$EC2_USER/geuckrock/current/geuckrock-front-server.jar || true

          echo "Updating current application..."
          sudo mkdir -p /home/$EC2_USER/geuckrock/current
          sudo mv /home/$EC2_USER/geuckrock/tobe/*.jar /home/$EC2_USER/geuckrock/current/geuckrock-front-server.jar

          echo "Starting new application..."
          cd /home/$EC2_USER/geuckrock/current
          sudo fuser -k -n tcp 8080 || true  # 8080 포트 사용 프로세스 종료
          nohup java -jar geuckrock-front-server.jar > output.log 2>&1 &

          sleep 5
          if pgrep -f "java -jar /home/$EC2_USER/geuckrock/current/geuckrock-front-server.jar" > /dev/null
          then
            echo "Application started successfully!"
          else
            echo "Application failed to start. Check the log for errors."
            exit 1
          fi
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
